<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let s = "glossy";
        document.write(s +"<br>");
        document.write(s.length+ "<br>");
        document.write(s.toUpperCase() + "<br>");
        document.write(s +"<br>");
        document.write(s.charAt(2) + "<br>");
        document.write(s +"<br>");
        document.write(s.lastIndexOf("y")+ "<br>");
        document.write(s +"<br>");
        document.write(s.includes("Gupta")+ "<br>");
        document.write(s +"<br>");
        document.write(s.replace("glossy","Angel")+ "<br>");
        
    </script>
</body>
</html>
